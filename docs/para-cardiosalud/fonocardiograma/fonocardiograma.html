const grid = document.getElementById('fcg-valve-grid');
const sel  = document.getElementById('fcg-valve-select');
const canvas = document.getElementById('fcg-canvas');
const ctx = canvas.getContext('2d');
let currentSev = 'leve', animFrame = null, animStart = null, currentValve = null;

VALVES.forEach(v => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'fcg-valve-btn';
  btn.dataset.valve = v.id;
  btn.innerHTML = '<div class="fcg-valve-dot" style="background:'+v.color+'"></div>'
    + '<span class="fcg-valve-code" style="color:'+v.color+'">'+v.id+'</span>'
    + '<span class="fcg-valve-name">'+v.name+'</span>';
  btn.addEventListener('click', () => selectValve(v));
  grid.appendChild(btn);
  const opt = document.createElement('option');
  opt.value = v.id; opt.textContent = v.id + ' — ' + v.name;
  sel.appendChild(opt);

sel.value = '';
sel.addEventListener('change', () => { const v = VALVES.find(x => x.id === sel.value); if (v) selectValve(v); });

function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth || 640;
  canvas.height = 220;
}

function drawStrip(valve, progress) {
  resizeCanvas();
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#fefcf5'; ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle = 'rgba(180,155,80,0.18)'; ctx.lineWidth = 0.5;
  for (let x=0;x<=W;x+=9){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<=H;y+=9){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(160,130,60,0.35)'; ctx.lineWidth = 0.8;
  for (let x=0;x<=W;x+=45){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<=H;y+=45){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  const ecg1y = H*0.18, ecg2y = H*0.40, fcgy = H*0.75, amp = H*0.09;
  const cycle = Math.floor(W / 4.2);

  ctx.fillStyle = '#666'; ctx.font = '9px monospace';
  ctx.fillText('II', 6, ecg1y+3); ctx.fillText('III', 5, ecg2y+3); ctx.fillText('FCG', 4, fcgy+3);

  ctx.strokeStyle = 'rgba(180,150,80,0.3)'; ctx.setLineDash([4,3]); ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(20, fcgy-28); ctx.lineTo(W, fcgy-28); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(180,150,80,0.2)'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(20, fcgy); ctx.lineTo(W, fcgy); ctx.stroke();

  const clipX = progress * W;

  function ecgSegment(xBase, yBase) {
    ctx.beginPath();
    ctx.moveTo(xBase, yBase);
    ctx.lineTo(xBase+16, yBase);
    ctx.quadraticCurveTo(xBase+24, yBase - amp*0.5, xBase+32, yBase);
    ctx.lineTo(xBase+50, yBase);
    ctx.lineTo(xBase+53, yBase + amp*0.2);
    ctx.lineTo(xBase+57, yBase - amp*2.4);
    ctx.lineTo(xBase+61, yBase + amp*0.4);
    ctx.lineTo(xBase+65, yBase);
    ctx.lineTo(xBase+76, yBase);
    ctx.quadraticCurveTo(xBase+88, yBase - amp*0.7, xBase+100, yBase);
    ctx.lineTo(xBase+cycle, yBase);
  }

  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
  const ncycles = Math.ceil((W-20) / cycle) + 1;
  for (let i=0;i<ncycles;i++){
    const xb = 20 + i*cycle; if (xb > clipX) break;
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,Math.min(clipX,xb+cycle),H); ctx.clip();
    ctx.beginPath(); ecgSegment(xb, ecg1y); ctx.stroke();
    ctx.beginPath(); ecgSegment(xb, ecg2y); ctx.stroke();
    ctx.restore();
  }

  const r1Offset = 57, r2Offset = 57 + Math.floor(cycle*0.43);
  for (let i=0;i<ncycles;i++){
    const xb = 20 + i*cycle; if (xb > clipX) break;
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,Math.min(clipX,xb+cycle+20),H); ctx.clip();
    const r1x = xb + r1Offset, r2x = xb + r2Offset, fcgAmp = H*0.10;

    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(xb, fcgy); ctx.lineTo(r1x-4, fcgy); ctx.stroke();

    ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(r1x-4, fcgy); ctx.lineTo(r1x, fcgy - fcgAmp*1.5); ctx.lineTo(r1x+4, fcgy + fcgAmp*0.5);
    ctx.lineTo(r1x+8, fcgy - fcgAmp*0.9); ctx.lineTo(r1x+12, fcgy); ctx.stroke();

    const sysStart = r1x+13, sysEnd = r2x-6, sysW = sysEnd - sysStart, mid = sysStart + sysW/2;

    if (valve.tipo === 'sistolico-plateau' || valve.tipo === 'cia') {
      const amp2 = valve.tipo === 'cia' ? fcgAmp*0.9 : fcgAmp*1.25;
      ctx.save(); ctx.globalAlpha = 0.13; ctx.fillStyle = valve.color;
      ctx.beginPath(); ctx.moveTo(sysStart, fcgy); ctx.lineTo(sysStart+4, fcgy - amp2); ctx.lineTo(sysEnd-4, fcgy - amp2); ctx.lineTo(sysEnd, fcgy); ctx.fill(); ctx.restore();
      ctx.strokeStyle = valve.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sysStart, fcgy); ctx.lineTo(sysStart+4, fcgy - amp2); ctx.lineTo(sysEnd-4, fcgy - amp2); ctx.lineTo(sysEnd, fcgy); ctx.stroke();
    } else if (valve.tipo === 'sistolico-romboide') {
      ctx.save(); ctx.globalAlpha = 0.13; ctx.fillStyle = valve.color;
      ctx.beginPath(); ctx.moveTo(sysStart, fcgy); ctx.quadraticCurveTo(mid-sysW*0.1, fcgy - fcgAmp*1.9, mid, fcgy - fcgAmp*1.9); ctx.quadraticCurveTo(mid+sysW*0.1, fcgy - fcgAmp*1.9, sysEnd, fcgy); ctx.fill(); ctx.restore();
      ctx.strokeStyle = valve.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sysStart, fcgy); ctx.quadraticCurveTo(mid-sysW*0.1, fcgy - fcgAmp*1.9, mid, fcgy - fcgAmp*1.9); ctx.quadraticCurveTo(mid+sysW*0.1, fcgy - fcgAmp*1.9, sysEnd, fcgy); ctx.stroke();
    } else if (valve.tipo === 'continuo') {
      const diaEnd = xb + cycle;
      ctx.save(); ctx.globalAlpha = 0.11; ctx.fillStyle = valve.color;
      ctx.beginPath(); ctx.moveTo(sysStart, fcgy); ctx.quadraticCurveTo(r2x-10, fcgy - fcgAmp*1.8, r2x, fcgy - fcgAmp*1.8); ctx.quadraticCurveTo(r2x+30, fcgy - fcgAmp*0.9, diaEnd, fcgy); ctx.fill(); ctx.restore();
      ctx.strokeStyle = valve.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(sysStart, fcgy); ctx.quadraticCurveTo(r2x-10, fcgy - fcgAmp*1.8, r2x, fcgy - fcgAmp*1.8); ctx.quadraticCurveTo(r2x+30, fcgy - fcgAmp*0.9, diaEnd, fcgy); ctx.stroke();
    } else {
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(sysStart, fcgy); ctx.lineTo(sysEnd, fcgy); ctx.stroke();
    }

    ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(r2x-6, fcgy); ctx.lineTo(r2x, fcgy - fcgAmp*1.0); ctx.lineTo(r2x+4, fcgy + fcgAmp*0.3); ctx.lineTo(r2x+8, fcgy - fcgAmp*0.6); ctx.lineTo(r2x+12, fcgy); ctx.stroke();

    if (valve.tipo === 'cia') {
      ctx.strokeStyle = valve.color; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(r2x+16, fcgy); ctx.lineTo(r2x+20, fcgy - fcgAmp*0.7); ctx.lineTo(r2x+24, fcgy + fcgAmp*0.2); ctx.lineTo(r2x+28, fcgy); ctx.stroke();
    }

    const diaS = r2x + 13, diaE = xb + cycle;
    if (valve.tipo === 'diastolico-decrescendo') {
      ctx.save(); ctx.globalAlpha = 0.11; ctx.fillStyle = valve.color;
      ctx.beginPath(); ctx.moveTo(diaS, fcgy); ctx.lineTo(diaS+2, fcgy - fcgAmp*1.6); ctx.quadraticCurveTo(diaS+40, fcgy - fcgAmp*0.6, diaE, fcgy); ctx.fill(); ctx.restore();
      ctx.strokeStyle = valve.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(diaS, fcgy); ctx.lineTo(diaS+2, fcgy - fcgAmp*1.6); ctx.quadraticCurveTo(diaS+40, fcgy - fcgAmp*0.6, diaE, fcgy); ctx.stroke();
    } else if (valve.tipo === 'diastolico-retumbo') {
      const camX = diaS + 14;
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(diaS, fcgy); ctx.lineTo(camX, fcgy); ctx.stroke();
      ctx.strokeStyle = valve.color; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(camX, fcgy); ctx.lineTo(camX+3, fcgy - fcgAmp*0.7); ctx.lineTo(camX+7, fcgy); ctx.stroke();
      ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = valve.color;
      ctx.beginPath(); ctx.moveTo(camX+8, fcgy);
      for (let rx=camX+8; rx<diaE-18; rx+=6){ ctx.lineTo(rx, fcgy - fcgAmp*(0.18 + 0.12*Math.sin(rx*0.35))); }
      ctx.lineTo(diaE-18, fcgy - fcgAmp*0.3); ctx.lineTo(diaE-14, fcgy - fcgAmp*0.9); ctx.lineTo(diaE-10, fcgy + fcgAmp*0.2); ctx.lineTo(diaE-6, fcgy - fcgAmp*0.55); ctx.lineTo(diaE, fcgy);
      ctx.fill(); ctx.restore();
      ctx.strokeStyle = valve.color; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(camX+8, fcgy);
      for (let rx=camX+8; rx<diaE-18; rx+=6){ ctx.lineTo(rx, fcgy - fcgAmp*(0.18 + 0.12*Math.sin(rx*0.35))); }
      ctx.lineTo(diaE-18, fcgy - fcgAmp*0.3); ctx.lineTo(diaE-14, fcgy - fcgAmp*0.9); ctx.lineTo(diaE-10, fcgy + fcgAmp*0.2); ctx.lineTo(diaE-6, fcgy - fcgAmp*0.55); ctx.lineTo(diaE, fcgy);
      ctx.stroke();
    } else if (valve.tipo !== 'continuo') {
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(diaS, fcgy); ctx.lineTo(diaE, fcgy); ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(74,158,255,0.5)'; ctx.lineWidth = 0.9; ctx.setLineDash([2,2]);
    ctx.beginPath(); ctx.moveTo(r1x, fcgy-30); ctx.lineTo(r1x, fcgy+16); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,90,90,0.5)';
    ctx.beginPath(); ctx.moveTo(r2x, fcgy-30); ctx.lineTo(r2x, fcgy+16); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#4a9eff'; ctx.font = 'bold 8px monospace'; ctx.fillText('R1', r1x-6, fcgy-32);
    ctx.fillStyle = '#ff5a5a'; ctx.fillText('R2', r2x-6, fcgy-32);
    ctx.restore();
  }

  ctx.fillStyle = '#aaa'; ctx.font = '8px monospace';
  for (let i=1; i*cycle < W; i++){ const tx = 20 + i*cycle; ctx.fillText('0:0'+i, tx-10, H-5); }

  ctx.save(); ctx.globalAlpha = 0.5;
  for (let i=0;i<ncycles;i++){
    const xb = 20 + i*cycle, r1x = xb + r1Offset, r2x = xb + r2Offset;
    ctx.fillStyle = 'rgba(74,158,255,0.06)'; ctx.fillRect(r1x, 0, r2x-r1x, H);
    ctx.fillStyle = 'rgba(255,90,90,0.04)'; ctx.fillRect(r2x, 0, xb+cycle-r2x, H);
  }
  ctx.restore();
}

function animate(valve) {
  if (animFrame) cancelAnimationFrame(animFrame);
  animStart = null;
  const DURATION = 1400;
  function step(ts) {
    if (!animStart) animStart = ts;
    const progress = Math.min((ts - animStart) / DURATION, 1);
    drawStrip(valve, progress);
    if (progress < 1) animFrame = requestAnimationFrame(step); else animFrame = null;
  }
  animFrame = requestAnimationFrame(step);
}

function selectValve(valve) {
  currentValve = valve;
  document.querySelectorAll('#tab-fono .fcg-valve-btn').forEach(b => { b.classList.remove('active'); b.style.borderColor=''; b.style.background=''; });
  const btn = document.querySelector('#tab-fono .fcg-valve-btn[data-valve="'+valve.id+'"]');
  if (btn) { btn.classList.add('active'); btn.style.borderColor = valve.color; btn.style.background = valve.color + '18'; }
  if (sel.value !== valve.id) sel.value = valve.id;

  document.getElementById('fcg-placeholder').style.display = 'none';
  canvas.style.display = 'block';
  document.getElementById('fcg-topbar').style.display = 'flex';
  document.getElementById('fcg-hint').style.display = 'block';
  const bd = document.getElementById('fcg-badge');
  bd.textContent = valve.id; bd.style.color = valve.color; bd.style.borderColor = valve.color;
  document.getElementById('fcg-name').textContent = valve.name;
  document.getElementById('fcg-pos').textContent = valve.pos;

  animate(valve);

  const panel = document.getElementById('fcg-info');
  if (valve.tipo === 'normal') {
    panel.classList.add('visible');
    document.getElementById('fcg-info-top').innerHTML =
      '<div class="fcg-info-item"><span class="fcg-info-lbl">Morfología FCG</span><span class="fcg-info-val">'+valve.morfologia+'</span></div>'
      + '<div class="fcg-info-item"><span class="fcg-info-lbl">Carácter</span><span class="fcg-info-val">'+valve.caracter+'</span></div>'
      + '<div class="fcg-info-item"><span class="fcg-info-lbl">Clave</span><span class="fcg-info-val">'+valve.clave+'</span></div>';
    document.getElementById('fcg-sev-tabs').style.display = 'none';
    document.getElementById('fcg-sev-leve').innerHTML = '';
    document.getElementById('fcg-sev-mod').innerHTML = '';
    document.getElementById('fcg-sev-sev').innerHTML = '';
    document.querySelectorAll('#tab-fono .fcg-sev-content').forEach(el => el.classList.remove('visible'));
    return;
  }

  panel.classList.add('visible');
  document.getElementById('fcg-sev-tabs').style.display = 'flex';
  document.getElementById('fcg-info-top').innerHTML =
    '<div class="fcg-info-item"><span class="fcg-info-lbl">Morfología</span><span class="fcg-info-val">'+valve.morfologia+'</span></div>'
    + '<div class="fcg-info-item"><span class="fcg-info-lbl">Carácter</span><span class="fcg-info-val">'+valve.caracter+'</span></div>'
    + '<div class="fcg-info-item"><span class="fcg-info-lbl">Irradia</span><span class="fcg-info-val">'+valve.irradia+'</span></div>'
    + '<div class="fcg-info-item"><span class="fcg-info-lbl">Claves</span><span class="fcg-info-val">'+valve.clave+'</span></div>';

  /* VERIFICADO 2026-09-08: interpola sin escapar, y es seguro sólo porque items y tip salen
     de VALVES —tabla literal de este archivo— por los tres únicos llamadores. Es invariante de
     PROCEDENCIA, no de tipo: si algún día recibe texto del estudio, es XSS directo; ahí hay que
     envolver con escHtml, que ya está disponible. */
  function makeList(items, tip) {
    let html = '<ul>';
    items.forEach(i => { html += '<li>'+i+'</li>'; });
    html += '</ul>';
    if (tip) html += '<div class="fcg-sev-tip">'+tip+'</div>';
    return html;
  }
  document.getElementById('fcg-sev-leve').innerHTML = makeList(valve.sev.leve, valve.tip && valve.tip.leve);
  document.getElementById('fcg-sev-mod').innerHTML  = makeList(valve.sev.mod,  valve.tip && valve.tip.mod);
  document.getElementById('fcg-sev-sev').innerHTML  = makeList(valve.sev.sev,  valve.tip && valve.tip.sev);
  showSev(currentSev);
}

function showSev(level) {
  currentSev = level;
  document.querySelectorAll('#tab-fono .fcg-sev-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#tab-fono .fcg-sev-content').forEach(c => c.classList.remove('visible'));
  const tab = document.querySelector('#tab-fono .fcg-tab-'+level); if (tab) tab.classList.add('active');
  const cont = document.getElementById('fcg-sev-'+level); if (cont) cont.classList.add('visible');
}

document.querySelectorAll('#tab-fono .fcg-sev-tab').forEach(t => {
  t.addEventListener('click', () => showSev(t.dataset.sev));
});

window.addEventListener('resize', () => { if (currentValve && animFrame === null) drawStrip(currentValve, 1); });
window.fcgOnShow = function(){ if (currentValve && animFrame === null) drawStrip(currentValve, 1); };
})();
</script>
